lass=\"system-caption\"\u003eConnection established\u003c/div\u003e\n        \u003cdiv class=\"bars\"\u003e\u003ci\u003e\u003c/i\u003e\u003ci\u003e\u003c/i\u003e\u003ci\u003e\u003c/i\u003e\u003ci\u003e\u003c/i\u003e\u003ci\u003e\u003c/i\u003e\u003ci\u003e\u003c/i\u003e\u003ci\u003e\u003c/i\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"system-card\"\u003e\n        \u003cdiv class=\"system-top\"\u003e\u003cspan\u003eACCESS LEVEL\u003c/span\u003e\u003cspan style=\"color:var(--bright)\"\u003e●\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"system-value\"\u003ePRIVATE\u003c/div\u003e\u003cdiv class=\"system-caption\"\u003eRestricted environment\u003c/div\u003e\n        \u003cdiv class=\"access-line\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"system-note\"\u003e\u003cstrong\u003e!\u003c/strong\u003e\u003cp\u003eYOU ARE ENTERING A DIFFERENT WORLD.\u003c/p\u003e\u003c/div\u003e\n    \u003c/aside\u003e\n  \u003c/main\u003e\n\n  \u003cfooter class=\"footer\"\u003e\u003cspan\u003eOWNER: SHUUDEO\u003c/span\u003e\u003cspan\u003eH. ANDLEBARS CREW © 2026\u003c/span\u003e\u003cspan\u003eALL SYSTEMS OPERATIONAL\u003c/span\u003e\u003c/footer\u003e\n\u003c/div\u003e\n\n\u003cdiv class=\"overlay\" id=\"about\"\u003e\n  \u003csection class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"aboutTitle\"\u003e\n    \u003cheader class=\"modal-head\"\u003e\u003cdiv\u003e\u003cspan class=\"modal-file\"\u003eINFORMATION FILE / 001\u003c/span\u003e\u003ch2 id=\"aboutTitle\"\u003eABOUT THE CREW\u003c/h2\u003e\u003c/div\u003e\u003cbutton class=\"close\" aria-label=\"Cerrar\"\u003e×\u003c/button\u003e\u003c/header\u003e\n    \u003cdiv class=\"modal-body\"\u003e\n      \u003cdiv class=\"label\"\u003e01 — THE CONCEPT\u003c/div\u003e\u003ch3\u003eWELCOME TO H. ANDLEBARS CREW.\u003c/h3\u003e\n      \u003cp\u003eH. ANDLEBARS CREW es un universo ficticio inspirado en los dramas de acción, los conflictos entre organizaciones y los secretos que existen detrás de la vida cotidiana.\u003c/p\u003e\n      \u003cp\u003eCada personaje tiene una historia, una identidad y un lugar dentro de un mundo donde las decisiones pueden cambiarlo todo.\u003c/p\u003e\n      \u003cdiv class=\"quote\"\u003e\u003cb\u003e“\u003c/b\u003e EVERYTHING HAS A PRICE.\u003c/div\u003e\n      \u003cdiv class=\"label\"\u003e02 — THE CREW\u003c/div\u003e\n      \u003cp\u003eEl nombre representa la identidad de una comunidad ficticia construida a partir de personajes, historias, alianzas y diferentes caminos narrativos.\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cfooter class=\"modal-foot\"\u003e\u003cspan\u003eEND OF FILE 001\u003c/span\u003e\u003cspan\u003eH. ANDLEBARS CREW\u003c/span\u003e\u003c/footer\u003e\n  \u003c/section\u003e\n\u003c/div\u003e\n\n\u003cdiv class=\"overlay\" id=\"file\"\u003e\n  \u003csection class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"fileTitle\"\u003e\n    \u003cheader class=\"modal-head\"\u003e\u003cdiv\u003e\u003cspan class=\"modal-file\"\u003eCREATION GUIDE / 002\u003c/span\u003e\u003ch2 id=\"fileTitle\"\u003eCREATE YOUR FILE\u003c/h2\u003e\u003c/div\u003e\u003cbutton class=\"close\" aria-label=\"Cerrar\"\u003e×\u003c/button\u003e\u003c/header\u003e\n    \u003cdiv class=\"modal-body\"\u003e\n      \u003cdiv class=\"label\"\u003eCHARACTER REGISTRATION\u003c/div\u003e\u003ch3\u003eCREATE YOUR IDENTITY.\u003c/h3\u003e\n      \u003cp\u003ePara formar parte de H. ANDLEBARS CREW deberás crear una ficha con la información básica de tu personaje. Esta ficha permitirá conocer su identidad y su historia.\u003c/p\u003e\n      \u003cdiv class=\"step\"\u003e\u003cspan class=\"step-number\"\u003e01\u003c/span\u003e\u003cdiv\u003e\u003ch4\u003eIDENTIDAD\u003c/h4\u003e\u003cp\u003eNombre, edad y apodo de tu personaje.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"step\"\u003e\u003cspan class=\"step-number\"\u003e02\u003c/span\u0 \u003e\n  \u003csection class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"shuudeoTitle\"\u003e\n    \u003cheader class=\"modalhead\"\u003e\u003cdiv\u003e\u003csmall\u003ePERSONNEL RECORD / 001\u003c/small\u003e\u003ch3 id=\"shuudeoTitle\"\u003eSHUUDEO\u003c/h3\u003e\u003c/div\u003e\u003cbutton class=\"close\" aria-label=\"Cerrar\"\u003e×\u003c/button\u003e\u003c/header\u003e\n    \u003cdiv class=\"modalbody\"\u003e\n      \u003cdiv class=\"lead\"\u003eFOUNDER \u0026amp; OWNER\u003c/div\u003e\n      \u003cp\u003eShuudeo es el fundador y responsable principal de H. ANDLEBARS CREW. Su papel es establecer la dirección general del proyecto, cuidar la identidad del team y supervisar que sus distintas áreas mantengan una misma línea.\u003c/p\u003e\n      \u003cp\u003eDentro de la comunidad, su perfil representa la creación, la planificación y la visión que dio origen a este espacio de roleplay.\u003c/p\u003e\n      \u003cdiv class=\"factgrid\"\u003e\u003cdiv class=\"fact\"\u003e\u003csmall\u003eROLE\u003c/small\u003e\u003cb\u003eOWNER\u003c/b\u003e\u003c/div\u003e\u003cdiv class=\"fact\"\u003e\u003csmall\u003eAREA\u003c/small\u003e\u003cb\u003eGENERAL DIRECTION\u003c/b\u003e\u003c/div\u003e\u003cdiv class=\"fact\"\u003e\u003csmall\u003eSTATUS\u003c/small\u003e\u003cb\u003eACTIVE\u003c/b\u003e\u003c/div\u003e\u003cdiv class=\"fact\"\u003e\u003csmall\u003eCREW\u003c/small\u003e\u003cb\u003eH. ANDLEBARS\u003c/b\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cp\u003eEste registro presenta su función dentro del team; los detalles personales del personaje pueden ampliarse cuando se defina su ficha oficial.\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cfooter class=\"modalfoot\"\u003e\u003cspan\u003eCONFIDENTIAL / HAC\u003c/span\u003e\u003cspan\u003eRECORD 001\u003c/span\u003e\u003c/footer\u003e\n  \u003c/section\u003e\n\u003c/div\u003e\n\n\u003cdiv class=\"overlay\" id=\"jennie\"\u003e\n  \u003csection class=\"modal\" role=\"dialog\" aria-modal=\"true\" a rentes. Explora cada expediente para conocer su función y cómo se organiza.\u003c/div\u003e\n\u003c/section\u003e\n\n\u003cmain class=\"orgs\"\u003e\n \u003carticle class=\"org\"\u003e\n  \u003cdiv class=\"org-head\"\u003e\u003cspan\u003eDIVISION / 001\u003c/span\u003e\u003cspan\u003eIKFC\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"symbol\"\u003eI\u003c/div\u003e\n  \u003ch2\u003eIKFC \u003cspan\u003eFIGHT LEAGUE\u003c/span\u003e\u003c/h2\u003e\n  \u003cp class=\"desc\"\u003eUna liga clandestina ficticia donde los enfrentamientos forman parte de una competencia organizada. Sus integrantes cumplen distintos roles dentro del espectáculo y la administración de la liga.\u003c/p\u003e\n  \u003cdiv class=\"tags\"\u003e\u003cspan\u003eCOMPETITION\u003c/span\u003e\u003cspan\u003eEVENTS\u003c/span\u003e\u003cspan\u003eRANK SYSTEM\u003c/span\u003e\u003c/div\u003e\n  \u003cbutton class=\"open\" data-org=\"ikfc\"\u003e\u003cspan\u003eOPEN ORGANIZATION FILE\u003c/span\u003e\u003cb\u003e↗\u003c/b\u003e\u003c/button\u003e\n \u003c/article\u003e\n \u003carticle class=\"org\"\u003e\n  \u003cdiv class=\"org-head\"\u003e\u003cspan\u003eDIVISION / 002\u003c/span\u003e\u003cspan\u003eRED CRACKER\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"symbol\"\u003eR\u003c/div\u003e\n  \u003ch2\u003eRED \u003cspan\u003eCRACKER\u003c/span\u003e\u003c/h2\u003e\n  \u003cp class=\"desc\"\u003eUna red ficticia de personajes que planifican operaciones narrativas y participan en misiones dentro del universo del team. Sus historias se desarrollan mediante expedientes y roles.\u003c/p\u003e\n  \u003cdiv class=\"tags\"\u003e\u003cspan\u003eFICTIONAL NETWORK\u003c/span\u003e\u003cspan\u003eMISSIONS\u003c/span\u003e\u003cspan\u003eSTRATEGY\u003c/span\u003e\u003c/div\u003e\n  \u003cbutton class=\"open\" data-org=\"cracker\"\u003e\u003cspan\u003eOPEN ORGANIZATION FILE\u003c/span\u003e\u003cb\u003e↗\u003c/b\u003e\u003c/button\u003e\n \u003c/article\u003e\n \u003carticle class=\"org\"\u003e\n  \u003cdiv class=\"org-head\"\u003e\u003cspan\u003eDIVISION / 003\u003c/span\u003e\u003cspan\u003eCYBER POLICE\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"symbol\"\u003eP\u003c/div\u003e\n  \u003ch2\u003ePOLICÍA \u003cspan\u003eCIBERNÉTICA\u003c/span\u003e\u003c/h2\u003e\n  \u003cp class=\"desc\"\u003eUna división institucional ficticia dedicada a investigar los acontecimientos de la red narrativa, reunir pistas dentro de las historias y coordinar a sus agentes.\u003c/p\u003e\n  \u003cdiv class=\"tags\"\u003e\u003cspan\u003eINVESTIGATION\u003c/span\u003e\u003cspan\u003eCASE FILES\u003c/span\u003e\u003cspan\u003eFIELD TEAM\u003c/span\u003e\u003c/div\u003e\n  \u003cbutton class=\"open\" data-org=\"police\"\u003e\u003cspan\u003eOPEN ORGANIZATION FILE\u003c/span\u003e\u003cb\u003e↗\u003c/b\u003e\u003c/button\u003e\n \u003c/article\u003e\n\u003c/main\u003e\n\n\u003csection class=\"note\"\u003e\u003cstrong\u003e!\u003c/strong\u003e\u003cp\u003e\u003cb\u003eROLEPLAY NOTICE //\u003c/b\u003e Las organizaciones, operaciones y situaciones descritas en esta web pertenecen a un universo de ficción. Los expedientes sirven para organizar personajes e historias del team.\u003c/p\u003e\u003c/section\u003e\n\u003cfooter class=\"bottom\"\u003e\u003ca class=\"navbtn\" href=\"02_founders.html\"\u003e← BACK TO FOUNDERS\u003c/a\u003e\u003cspan\u003eH. ANDLEBARS CREW © 2026\u003c/span\u003e\u003cspan\u003ePAGE 03 / 07\u003c/span\u003e\u003ca class=\"navbtn\" href=\"04_hierarchy.html\"\u003eNEXT: HIERARCHY →\u003c/a\u003e\u003c/footer\u003e\n\u003c/div\u003e\n\n\u003cdiv class=\"overlay\" id=\"ikfc\"\u003e\u003csection class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"ikfcTitle\"\u003e\n\u003cheader class=\"modalhead\"\u003e\u003cdiv\u003e\u003csmall\u003eORGANIZATION FILE / 001\u003c/small\u003e\u003ch3 id=\"ikfcTitle\"\u003eIKFC — FIGHT LEAGUE\u003c/h3\u003e\u003c/div\u003e\u003cbutton class=\"close\" aria-label=\"Cerrar\"\u003e×\u003c/button\u003e\u003c/header\u003e\n\u003cdiv class=\"modalbody\"\u003e\u003cdiv class=\"modal-label\"\u003eDIVISION PROFILE / COMPETITION\u003c/div\u003e\u003ch4\u003eTHE LEAGUE\u003c/h4\u003e\n\u003cp\u003eIKFC es una liga de combate ficticia dentro del universo de H. ANDLEBARS CREW. Su actividad se organiza alrededor de eventos narrativos, participantes y un equipo encargado de coordinar cada encuentro.\u003c/p\u003e\n\u003cp\u003eLa organización cuenta con tres rangos principales y una figura de dirección que supervisa el funcionamiento general de la liga.\u003c/p\u003e\n\u003cdiv class=\"ranklist\"\u003e\n\u003cdiv class=\"rank\"\u003e\u003cb\u003eRANK 01\u003c/b\u003e\u003cspan\u003e\u003cstrong\u003eOrganizadores:\u003c/strong\u003e preparan los eventos, coordinan los enfrentamientos y gestionan la transmisión ficticia de cada encuentro.\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"rank\"\u003e\u003cb\u003eRANK 02\u003c/b\u003e\u003cspan\u003e\u003cstrong\u003eParticipantes:\u003c/strong\u003e representan a los competidores de la liga y forman parte de los enfrentamientos dentro de las historias.\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"rank\"\u003e\u003cb\u003eRANK 03\u003c/b\u003e\u003cspan\u003e\u003cstrong\u003eDirección:\u003c/strong\u003e corresponde al jefe o responsable principal de IKFC, quien supervisa la división.\u003c/span\u003e\u003c/div\u003e\n\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"modalfoot\"\u003e\u003cspan\u003eFICTIONAL DIVISION / HAC\u003c/span\u003e\u003cspan\u003eFILE 001\u003c/span\u003e\u003c/footer\u003e\u003c/section\u003e\u003c/div\u003e\n\n\u003cdiv class=\"overlay\" id=\"cracker\"\u003e\u003csection class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"crackerTitle\"\u003e\n\u003cheader class=\"modalhead\"\u003e\u003cdiv\u003e\u003csmall\u003eORGANIZATION FILE / 002\u003c/small\u003e\u003ch3 id=\"crackerTitle\"\u003eRED CRACKER\u003c/h3\u003e\u003c/div\u003e\u003cbutton class=\"close\" aria-label=\"Cerrar\"\u003e×\u003c/button\u003e\u003c/header\u003e\n\u003cdiv class=\"modalbody\"\u003e\u003cdiv class=\"modal-label\"\u003eDIVISION PROFILE / FICTIONAL NETWORK\u003c/div\u003e\u003ch4\u003eTHE NETWORK\u003c/h4\u003e\n\u003cp\u003eRed Cracker es una red ficticia que reúne personajes vinculados a misiones y conflictos digitales dentro de la trama. Su enfoque es narrativo: cada operación se plantea como parte de una historia, con objetivos y consecuencias para los personajes.\u003c/p\u003e\n\u003cp\u003eLa red se divide en tres rangos operativos y una dirección general.\u003c/p\u003e\n\u003cdiv class=\"ranklist\"\u003e\n\u003cdiv class=\"rank\"\u003e\u003cb\u003eRANK 01\u003c/b\u003e\u003cspan\u003e\u003cstrong\u003ePlanificadores:\u003c/strong\u003e proponen los objetivos y desarrollan el contexto de las operaciones ficticias.\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"rank\"\u003e\u003cb\u003eRANK 02\u003c/b\u003e\u003cspan\u003e\u003cstrong\u003eOperadores digitales:\u003c/strong\u003e interpretan el papel de especialistas en las misiones narrativas relacionadas con la red.\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"rank\"\u003e\u003cb\u003eRANK 03\u003c/b\u003e\u003cspan\u003e\u003cstrong\u003eOperadores de campo:\u003c/strong\u003e representan a los personajes que participan presencialmente en las escenas de las misiones.\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"rank\"\u003e\u003cb\u003eDIRECTOR\u003c/b\u003e\u003cspan\u003e\u003cstrong\u003eDirección:\u003c/strong\u003e coordina la división y define su línea general dentro de la historia.\u003c/span\u003e\u003c/div\u003e\n\u003c/div\u003e\u003cp\u003eLas misiones se desarrollan como ficción y no incluyen instrucciones para acceder a sistemas reales.\u003c/p\u003e\u003c/div\u003e\u003cfooter class=\"modalfoot\"\u003e\u003cspan\u003eFICTIONAL DIVISION / HAC\u003c/span\u003e\u003cspan\u003eFILE 002\u003c/span\u003e\u003c/footer\u003e\u003c/section\u003e\u003c/div\u003e\n\n\u003cdiv class=\"overlay\" id=\"police\"\u003e\u003csection class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"policeTitle\"\u003e\n\u003cheader class=\"modalhead\"\u003e\u003cdiv\u003e\u003csmall\u003eORGANIZATION FILE / 003\u003c/small\u003e\u003ch3 id=\"policeTitle\"\u003ePOLICÍA CIBERNÉTICA\u003c/h3\u003e\u003c/div\u003e\u003cbutton class=\"close\" aria-label=\"Cerrar\"\u003e×\u003c/button\u003e\u003c/header\u003e\n\u003cdiv class=\"modalbody\"\u003e\u003cdiv class=\"modal-label\"\u003eDIVISION PROFILE / INVESTIGATION\u003c/div\u003e\u003ch4\u003eTHE CYBER UNIT\u003c/h4\u003e\n\u003cp\u003eLa Policía Cibernética es una división institucional ficticia que investiga los sucesos relacionados con las redes y organizaciones del universo narrativo. Sus integrantes construyen casos, revisan pistas ficticias y participan en escenas de investigación.\u003c/p\u003e\n\u003cp\u003eSu estructura contempla tres rangos, desde el análisis de información hasta la dirección de la división.\u003c/p\u003e\n\u003cdiv class=\"ranklist\"\u003e\n\u003cdiv class=\"rank\"\u003e\u003cb\u003eRANK 01\u003c/b\u003e\u003cspan\u003e\u003cstrong\u003eAnalistas digitales:\u003c/strong\u003e estudian los antecedentes ficticios, organizan pistas y elaboran informes para los casos.\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"rank\"\u003e\u003cb\u003eRANK 02\u003c/b\u003e\u003cspan\u003e\u003cstrong\u003eAgentes de campo:\u003c/strong\u003e participan en las investigaciones presenciales y representan a los agentes dentro de las escenas.\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"rank\"\u003e\u003cb\u003eRANK 03\u003c/b\u003e\u003cspan\u003e\u003cstrong\u003eJefatura:\u003c/strong\u003e corresponde al comisario o jefe de la división, encargado de supervisar al equipo.\u003c/span\u003e\u003c/div\u003e\n\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"modalfoot\"\u003e\u003cspan\u003eFICTIONAL DIVISION / HAC\u003c/span\u003e\u003cspan\u003eFILE 003\u003c/span\u003e\u003c/footer\u003e\ \u003c/div\u003e\u003c/header\u003e\n\n\u003csection class=\"hero\"\u003e\n \u003cdiv class=\"kicker\"\u003eHAC — INTERNAL DIRECTORY / 004\u003c/div\u003e\n \u003ch1\u003eRANKS \u003cspan\u003e\u0026\u003c/span\u003e HIERARCHY\u003c/h1\u003e\n \u003cp\u003eKNOW YOUR PLACE. KNOW YOUR ROLE.\u003c/p\u003e\n \u003cdiv class=\"rule\"\u003eSELECT AN ORGANIZATION\u003c/div\u003e\n \u003cdiv class=\"intro\"\u003eCada organización tiene su propia estructura y responsabilidades. Selecciona una división y abre cada rango para conocer qué función cumple dentro del universo de H. ANDLEBARS CREW.\u003c/div\u003e\n\u003c/section\u003e\n\n\u003cnav class=\"selector\" aria-label=\"Seleccionar organización\"\u003e\n \u003cbutton class=\"tab active\" data-tab=\"ikfc\"\u003e01 / IKFC\u003c/button\u003e\n \u003cbutton class=\"tab\" data-tab=\"cracker\"\u003e02 / RED CRACKER\u003c/button\u003e\n \u003cbutton class=\"tab\" data-tab=\"police\"\u003e03 / POLICÍA CIBERNÉTICA\u003c/button\u003e\n\u003c/nav\u003e\n\n\u003csection class=\"org-panel active\" id=\"ikfc\"\u003e\n \u003cheader class=\"panelhead\"\u003e\u003cdiv\u003e\u003csmall\u003eDIVISION 001 / COMPETITION\u003c/small\u003e\u003ch2\u003eIKFC — FIGHT LEAGUE\u003c/h2\u003e\u003c/div\u003e\u003cp\u003e3 RANKS\u003cbr\u003e+ LEADERSHIP\u003c/p\u003e\u003c/header\u003e\n \u003cdiv class=\"hierarchy\"\u003e\n  \u003carticle class=\"rankcard\"\u003e\u003cdiv class=\"rankno\"\u003eRANK / 01\u003c/div\u003e\u003cdiv class=\"rankinfo\"\u003e\u003ch3\u003eORGANIZADORES\u003c/h3\u003e\u003cp\u003ePreparan y coordinan los eventos de la liga.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"expand\"\u003e+\u003c/div\u003e\u003cdiv class=\"extra\"\u003eSe encargan de proponer fechas, ordenar la programación, coordinar a los participantes y presentar cada encuentro dentro de la historia. También administran la transmisión ficticia y el registro de donaciones narrativas.\u003c/div\u003e\u003c/article\u003e\n  \u003carticle class=\"rankcard\"\u003e\u003cdiv class=\"rankno\"\u003eRANK / 02\u003c/div\u003e\u003cdiv class=\"rankinfo\"\u003e\u003ch3\u003ePARTICIPANTES\u003c/h3\u003e\u003cp\u003eSon los competidores que dan vida a los encuentros.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"expand\"\u003e+\u003c/div\u003e\u003cdiv class=\"extra\"\u003eCrean un personaje, participan en los eventos de roleplay y desarrollan rivalidades o alianzas dentro de la trama. Las recompensas se representan como parte del sistema ficticio de la liga.\u003c/div\u003e\u003c/article\u003e\n  \u003carticle class=\"rankcard\"\u003e\u003cdiv class=\"rankno\"\u003eRANK / 03\u003c/div\u003e\u003cdiv class=\"rankinfo\"\u003e\u003ch3\u003eJEFE DE IKFC\u003c/h3\u003e\u003cp\u003eMáxima autoridad y responsable de la división.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"expand\"\u003e+\u003c/div\u003e\u003cdiv class=\"extra\"\u003eSupervisa el funcionamiento general de IKFC, valida decisiones importantes y mantiene la coherencia de las actividades y reglas narrativas de la liga.\u003c/div\u003e\u003c/article\u003e\n \u003c/div\u003e\n \u003cdiv class=\"flow\"\u003e\u003cspan\u003eORGANIZACIÓN\u003c/span\u003e\u003ci\u003e\u003c/i\u003e\u003cspan\u003ePARTICIPACIÓN\u003c/span\u003e\u003ci\u003e\u003c/i\u003e\u003cspan\u003eDIRECCIÓN\u003c/span\u003e\u003c/div\u003e\n\u003c/section\u003e\n\n\u003csection class=\"org-panel\" id=\"cracker\"\u003e\n \u003cheader class=\"panelhead\"\u003e\u003cdiv\u003e\u003csmall\u003eDIVISION 002 / FICTIONAL NETWORK\u003c/small\u003e\u003ch2\u003eRED CRACKER\u003c/h2\u003e\u003c/div\u003e\u003cp\u003e3 RANKS\u003cbr\u003e+ DIRECTOR\u003c/p\u003e\u003c/header\u003e\n \u003cdiv class=\"hierarchy\"\u003e\n  \u003carticle class=\"rankcard\"\u003e\u003cdiv class=\"rankno\"\u003eRANK / 01\u003c/div\u003e\u003cdiv class=\"rankinfo\"\u003e\u003ch3\u003ePLANIFICADORES\u003c/h3\u003e\u003cp\u003eDiseñan el contexto y los objetivos de las misiones ficticias.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"expand\"\u003e+\u003c/div\u003e\u003cdiv class=\"extra\"\u003eProponen ideas para las tramas, definen objetivos narrativos y preparan los antecedentes de cada expediente. Su trabajo se limita a la planificación de historias y escenas de roleplay.\u003c/div\u003e\u003c/article\u003e\n  \u003carticle class=\"rankcard\"\u003e\u003cdiv class=\"rankno\"\u003eRANK / 02\u003c/div\u003e\u003cdiv class=\"rankinfo\"\u003e\u003ch3\u003eOPERADORES DIGITALES\u003c/h3\u003e\u003cp\u003eInterpretan el rol de especialistas digitales en la historia.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"expand\"\u003e+\u003c/div\u003e\u003cdiv class=\"extra\"\u003eParticipan en misiones narrativas mediante personajes que analizan pistas ficticias, redactan reportes y colaboran con el desarrollo de los casos. No realizan accesos ni acciones sobre sistemas reales.\u003c/div\u003e\u003c/article\u003e\n  \u003carticle class=\"rankcard\"\u003e\u003cdiv class=\"rankno\"\u003eRANK / 03\u003c/div\u003e\u003cdiv class=\"rankinfo\"\u003e\u003ch3\u003eOPERADORES DE CAMPO\u003c/h3\u003e\u003cp\u003eRepresentan a los personajes que participan presencialmente.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"expand\"\u003e+\u003c/div\u003e\u003cdiv class=\"extra\"\u003eDan vida a las escenas presenciales de las misiones ficticias, interactúan con otros personajes y desarrollan las consecuencias narrativas de cada operación.\u003c/div\u003e\u003c/article\u003e\n  \u003carticle class=\"rankcard\"\u003e\u003cdiv class=\"rankno\"\u003eLEADERSHIP\u003c/div\u003e\u003cdiv class=\"rankinfo\"\u003e\u003ch3\u003eDIRECTOR\u003c/h3\u003e\u003cp\u003eCoordina la red y supervisa su línea narrativa.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"expand\"\u003e+\u003c/div\u003e\u003cdiv class=\"extra\"\u003eOrganiza el trabajo de los distintos rangos, aprueba propuestas de historia y mantiene una dirección común para la división.\u003c/div\u003e\u003c/article\u003e\n \u003c/div\u003e\n \u003cdiv class=\"flow\"\u003e\u003cspan\u003ePLANIFICACIÓN\u003c/span\u003e\u003ci\u003e\u003c/i\u003e\u003cspan\u003eOPERACIÓN NARRATIVA\u003c/span\u003e\u003ci\u003e\u003c/i\u003e\u003cspan\u003eCOORDINACIÓN\u003c/span\u003e\u003c/div\u003e\n\u003c/section\u003e\n\n\u003csection class=\"org-panel\" id=\"police\"\u003e\n \u003cheader class=\"panelhead\"\u003e\u003cdiv\u003e\u003csmall\u003eDIVISION 003 / INVESTIGATION\u003c/small\u003e\u003ch2\u003ePOLICÍA CIBERNÉTICA\u003c/h2\u003e\u003c/div\u003e\u003cp\u003e3 RANKS\u003cbr\u003e+ COMMISSIONER\u003c/p\u003e\u003c/header\u003e\n \u003cdiv class=\"hierarchy\"\u003e\n  \u003carticle class=\"rankcard\"\u003e\u003cdiv class=\"rankno\"\u003eRANK / 01\u003c/div\u003e\u003cdiv class=\"rankinfo\"\u003e\u003ch3\u003eANALISTAS DIGITALES\u003c/h3\u003e\u003cp\u003eOrdenan antecedentes y pistas de los casos ficticios.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"expand\"\u003e+\u003c/div\u003e\u003cdiv class=\"extra\"\u003eRevisan los elementos de cada expediente de roleplay, organizan la información entregada por la trama y preparan informes para apoyar el avance de la investigación.\u003c/div\u003e\u003c/article\u003e\n  \u003carticle class=\"rankcard\"\u003e\u003cdiv class=\"rankno\"\u003eRANK / 02\u003c/div\u003e\u003cdiv class=\"rankinfo\"\u003e\u003ch3\u003eAGENTES DE CAMPO\u003c/h3\u003e\u003cp\u003eParticipan en las escenas presenciales de investigación.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"expand\"\u003e+\u003c/div\u003e\u003cdiv class=\"extra\"\u003eInterpretan a los agentes que siguen las pistas dentro de las escenas, conversan con personajes y representan las diligencias ficticias definidas para cada caso.\u003c/div\u003e\u003c/article\u003e\n  \u003carticle class=\"rankcard\"\u003e\u003cdiv class=\"rankno\"\u003eRANK / 03\u003c/div\u003e\u003cdiv class=\"rankinfo\"\u003e\u003ch3\u003eCOMISARIO / JEFE\u003c/h3\u003e\u003cp\u003eMáxima autoridad de la división policial ficticia.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"expand\"\u003e+\u003c/div\u003e\u003cdiv class=\"extra\"\u003eSupervisa a los equipos, distribuye responsabilidades narrativas y coordina la dirección general de los casos dentro de la historia.\u003c/div\u003e\u003c/article\u003e\n \u003c/div\u003e\n \u003cdiv class=\"flow\"\u003e\u003cspan\u003eANÁLISIS\u003c/span\u003e\u003ci\u003e\u003c/i\u003e\u003cspan\u003eINVESTIGACIÓN\u003c/span\u003e\u003ci\u003e\u003c/i\u003e\u003cspan\u003eJEFATURA\u003c/span\u003e\u003c/div\u003e\n\u003c/section\u003e\n\n\u003cdiv class=\"tip\"\u003e\u003cb\u003eHOW TO INTERACT //\u003c/b\u003e Selecciona una organización para cambiar de estructura. Pulsa cualquier rango para desplegar su descripción. Vuelve a pulsarlo para contraerlo.\u003c/div\u003e\n\u003cfooter class=\"bottom\"\u003e\u003ca class=\"navbtn\" href=\"03_organizations.html\"\u003e← BACK TO ORGANIZATIONS\u003c/a\u003e\u003cspan\u003eH. ANDLEBARS CREW © 2026\u003c/span\u003e\u003cspan\u003ePAGE 04 / 07\u003c/span\u003e\u003ca class=\"navbtn\" href=\"05_rules.html\"\u003eNEXT: RULES →\u003c/a\u003e\u003c/footer\u003e\n\u003c/div\u003e\n\u003cdiv class=\"toast\" id=\"toast\"\u003eORGANIZATION LOADED\u003c/div\u003e\n\u003cscript\u003e\nconst tabs=[...document.querySelectorAll('.tab')],panels=[...document.querySelectorAll('.org-panel')],toast=document.getElementById('toast');\nlet toastTimer;\nfunction showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=\u003etoast.classList.remove('show'),1300)}\ntabs.forEach(tab=\u003etab.addEventListener('click',()=\u003e{\n if(tab.classList.contains('active'))return;\n tabs.forEach(t=\u003et.classList.remove('active'));tab.classList.add('active');\n panels.forEach(p=\u003ep.classList.remove('active'));\n const panel=document.getElementById(tab.dataset.tab);panel.classList.add('active');\n panel.querySelectorAll('.rankcard').forEach(c=\u003ec.classList.remove('expanded'));\n showToast('LOADED / '+tab.textContent.trim());\n}));\ndocument.querySelect =\"\" href=\"06_notice_board.html\"\u003e\u003cspan class=\"num\"\u003e06\u003c/span\u003eNOTICES\u003c/a\u003e\u003ca class=\"\" href=\"07_member_directory.html\"\u003e\u003cspan class=\"num\"\u003e07\u003c/span\u003eDIRECTORY\u003c/a\u003e\u003c/nav\u003e\n\u003cdiv class=\"page\"\u003e\u003cdiv class=\"grid\"\u003e\u003c/div\u003e\u003cdiv class=\"scan\"\u003e\u003c/div\u003e\n\u003cheader class=\"top\"\u003e\u003cdiv class=\"brand\"\u003e\u003cb\u003eH.\u003c/b\u003e\u003cspan\u003eH. ANDLEBARS CREW / INTERNAL PROTOCOL\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"status\"\u003e\u003ci class=\"led\"\u003e\u003c/i\u003e RULES DATABASE / ACTIVE\u003c/div\u003e\u003c/header\u003e\n\u003csection class=\"hero\"\u003e\u003cdiv class=\"kicker\"\u003eHAC — COMMUNITY GUIDELINES / 005\u003c/div\u003e\u003ch1\u003eRULES \u003cspan\u003e\u0026\u003c/span\u003e PROTOCOL\u003c/h1\u003e\u003cp\u003eRESPECT THE CREW. RESPECT THE STORY.\u003c/p\u003e\u003cdiv class=\"intro\"\u003eEste espacio reúne las normas generales para mantener una comunidad ordenada, segura y entretenida. Selecciona una categoría y abre cada expediente para leer sus reglas completas.\u003c/div\u003e\u003cdiv class=\"signal\"\u003ePLEASE READ BEFORE PARTICIPATING\u003c/div\u003e\u003c/section\u003e\n\u003csection class=\"stats\"\u003e\u003cdiv class=\"stat\"\u003e\u003cb\u003e05\u003c/b\u003e\u003cspan\u003eRULE CATEGORIES\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"stat\"\u003e\u003cb\u003e15\u003c/b\u003e\u003cspan\u003eGUIDELINES\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"stat\"\u003e\u003cb\u003eHAC\u003c/b\u003e\u003cspan\u003eONE COMMUNITY\u003c/span\u003e\u003c/div\u003e\u003c/section\u003e\n\u003cnav class=\"tabs\" aria-label=\"Categorías de reglas\"\u003e\n\u003cbutton class=\"tab active\" data-tab=\"general\"\u003e01 / GENERAL\u003c/button\u003e\u003cbutton class=\"tab\" data-tab=\"respect\"\u003e02 / RESPETO\u003c/button\u003e\u003cbutton class=\"tab\" data-tab=\"roleplay\"\u003e03 / ROLEPLAY\u003c/button\u003e\u003cbutton class=\"tab\" data-tab=\"activity\"\u003e04 / ACTIVIDAD\u003c/button\u003e\u003cbutton class=\"tab\" data-tab=\"safety\"\u003e05 / SEGURIDAD\u003c/button\u003e\n\u003c/nav\u003e\n\u003cmain class=\"content\"\u003e\n\u003csection class=\"category active\" id=\"general\"\u003e\n\u003cheader class=\"cathead\"\u003e\u003cdiv\u003e\u003csmall\u003ePROTOCOL 001 / COMMUNITY\u003c/small\u003e\u003ch2\u003eGENERAL RULES\u003c/h2\u003e\u003c/div\u003e\u003cp\u003eFOUNDATION\u003cbr\u003e01—03\u003c/p\u003e\u003c/header\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e01\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003eRESPETA LAS NORMAS\u003c/strong\u003e\u003csmall\u003eLas reglas se aplican a todos los integrantes.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003eLee las indicaciones fijadas y respeta los acuerdos del team. Si una norma no está clara, pregunta a un owner o moderador antes de asumir cómo funciona.\u003c/span\u003e\u003c/button\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e02\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003eORDEN EN LOS CANALES\u003c/strong\u003e\u003csmall\u003eUsa cada espacio para el propósito indicado.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003ePublica fichas, anuncios, conversaciones y escenas en sus canales correspondientes. Evita saturar espacios que tienen una función específica.\u003c/span\u003e\u003c/button\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e03\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003eINDICACIONES DEL STAFF\u003c/strong\u003e\u003csmall\u003eLa coordinación ayuda a mantener el funcionamiento.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003eSigue las instrucciones razonables del equipo de administración. Si no estás de acuerdo con una decisión, conversa el tema en privado y con respeto.\u003c/span\u003e\u003c/button\u003e\n\u003c/section\u003e\n\u003csection class=\"category\" id=\"respect\"\u003e\n\u003cheader class=\"cathead\"\u003e\u003cdiv\u003e\u003csmall\u003ePROTOCOL 002 / CONDUCT\u003c/small\u003e\u003ch2\u003eRESPECT \u0026 CONDUCT\u003c/h2\u003e\u003c/div\u003e\u003cp\u003eCOMMUNITY\u003cbr\u003e04—06\u003c/p\u003e\u003c/header\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e04\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003eTRATO RESPETUOSO\u003c/strong\u003e\u003csmall\u003eNo se permiten insultos, acoso ni discriminación.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003eTrata a cada integrante con respeto. No se toleran ataques por identidad, apariencia, nacionalidad, gustos u otras características personales.\u003c/span\u003e\u003c/button\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e05\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003ePROBLEMAS PERSONALES\u003c/strong\u003e\u003csmall\u003eResuelve los conflictos sin convertirlos en espectáculos.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003eEvita exponer conversaciones privadas, organizar ataques grupales o involucrar a personas ajenas. Si surge un conflicto, pide apoyo al staff.\u003c/span\u003e\u003c/button\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e06\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003ePRIVACIDAD\u003c/strong\u003e\u003csmall\u003eLa información personal se mantiene fuera del juego.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003eNo compartas datos personales, capturas privadas ni información de otra persona sin su permiso. Nadie debe presionar a un integrante para revelar información privada.\u003c/span\u003e\u003c/button\u003e\n\u003c/section\u003e\n\u003csection class=\"category\" id=\"roleplay\"\u003e\n\u003cheader class=\"cathead\"\u003e\u003cdiv\u003e\u003csmall\u003ePROTOCOL 003 / STORY MODE\u003c/small\u003e\u003ch2\u003eROLEPLAY RULES\u003c/h2\u003e\u003c/div\u003e\u003cp\u003eFICTION\u003cbr\u003e07—09\u003c/p\u003e\u003c/header\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e07\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003eSEPARA FICCIÓN Y REALIDAD\u003c/strong\u003e\u003csmall\u003eLas organizaciones y misiones pertenecen a la historia.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003eIKFC, Red Cracker y Policía Cibernética son elementos ficticios del universo del team. Las escenas no autorizan ni requieren acciones peligrosas, ilegales o invasivas en la vida real.\u003c/span\u003e\u003c/button\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e08\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003eRESPETA LAS FICHAS\u003c/strong\u003e\u003csmall\u003eNo controles personajes que pertenecen a otra persona.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003eNo decidas las acciones, pensamientos o resultados de otro personaje sin acuerdo. Da espacio para que cada participante responda y construya su parte de la historia.\u003c/span\u003e\u003c/button\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e09\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003eCOHERENCIA NARRATIVA\u003c/strong\u003e\u003csmall\u003eMantén consistencia con el universo y los acuerdos.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003eRespeta los rangos, límites y acontecimientos ya establecidos. Si quieres introducir un giro importante, consúltalo con las personas involucradas o con el staff.\u003c/span\u003e\u003c/button\u003e\n\u003c/section\u003e\n\u003csection class=\"category\" id=\"activity\"\u003e\n\u003cheader class=\"cathead\"\u003e\u003cdiv\u003e\u003csmall\u003ePROTOCOL 004 / PARTICIPATION\u003c/small\u003e\u003ch2\u003eACTIVITY \u0026 TEAMWORK\u003c/h2\u003e\u003c/div\u003e\u003cp\u003eTEAMWORK\u003cbr\u003e10—12\u003c/p\u003e\u003c/header\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e10\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003eAVISA SI TE AUSENTAS\u003c/strong\u003e\u003csmall\u003eLa comunicación evita confusiones.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003eSi estarás fuera por un tiempo, avisa cuando puedas. No es necesario compartir motivos personales: basta con indicar que estarás ausente y, si lo sabes, cuándo volverás.\u003c/span\u003e\u003c/button\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e11\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003ePARTICIPACIÓN EQUILIBRADA\u003c/strong\u003e\u003csmall\u003eColabora sin exigir disponibilidad constante.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003eParticipa de acuerdo con tu disponibilidad. Nadie debe sentirse obligado a estar conectado todo el día ni recibir presión por responder inmediatamente.\u003c/span\u003e\u003c/button\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e12\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003eTRABAJO EN EQUIPO\u003c/strong\u003e\u003csmall\u003eEscucha propuestas y respeta los acuerdos.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003eLas ideas pueden debatirse sin ataques personales. Reconoce el aporte de los demás, cumple los acuerdos que aceptaste y pide ayuda si algo se complica.\u003c/span\u003e\u003c/button\u003e\n\u003c/section\u003e\n\u003csection class=\"category\" id=\"safety\"\u003e\n\u003cheader class=\"cathead\"\u003e\u003cdiv\u003e\u003csmall\u003ePROTOCOL 005 / WELLBEING\u003c/small\u003e\u003ch2\u003eSAFETY \u0026 BOUNDARIES\u003c/h2\u003e\u003c/div\u003e\u003cp\u003eWELLBEING\u003cbr\u003e13—15\u003c/p\u003e\u003c/header\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e13\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003eNADA DE ACCIONES REALES PELIGROSAS\u003c/strong\u003e\u003csmall\u003eLas misiones se desarrollan solo como ficción.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003eNo se permiten retos, encuentros, persecuciones, peleas ni actividades peligrosas en la vida real como parte del roleplay. No compartas instrucciones para hacer daño o vulnerar sistemas reales.\u003c/span\u003e\u003c/button\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e14\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003eLÍMITES PERSONALES\u003c/strong\u003e\u003csmall\u003ePuedes pausar o rechazar una escena.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003eSi una escena o conversación te incomoda, puedes pedir que se detenga o retirarte. Respeta también los límites que expresen los demás, sin insistir ni presionar.\u003c/span\u003e\u003c/button\u003e\n\u003cbutton class=\"rule\"\u003e\u003cspan class=\"number\"\u003e15\u003c/span\u003e\u003cspan class=\"ruletext\"\u003e\u003cstrong\u003eREPORTA SITUACIONES\u003c/strong\u003e\u003csmall\u003eBusca apoyo si algo cruza los límites.\u003c/small\u003e\u003c/span\u003e\u003cspan class=\"plus\"\u003e+\u003c/span\u003e\u003cspan class=\"detail\"\u003eSi recibes amenazas, acoso o presión, guarda la evidencia que sea segura conservar y comunícalo al staff. Si existe un riesgo real o inmediato, acude a una persona adulta de confianza o a los servicios locales correspondientes.\u003c/span\u003e\u003c/button\u003e\n\u003c/section\u003e\n\u003c/main\u003e\n\u003caside class=\"notice\"\u003e\u003cb\u003eADMINISTRATIVE NOTE //\u003c/b\u003e Estas reglas son una propuesta inicial para la comunidad y deben ser revisadas por los owners antes de publicarse como normas oficiales. El staff puede aclararlas y actualizarlas de forma transparente.\u003c/aside\u003e\n\u003csection class=\"agreement\"\u003e\n\u003ch2\u003eMEMBER ACKNOWLEDGEMENT\u003c/h2\u003e\u003cp\u003eMarca la casilla si has leído esta propuesta de reglas. Este botón solo muestra una confirmación en esta página; no guarda datos ni registra tu identidad.\u003c/p\u003e\n\u003clabel class=\"checkrow\"\u003e\u003cinput type=\"checkbox\" id=\"agree\"\u003e \u003cspan\u003eHe leído las reglas y entiendo que debo respetar a los demás integrantes, sus límites y la separación entre ficción y realidad.\u003c/span\u003e\u003c/label\u003e\n\u003cbutton class=\"ack\" id=\"ack\" disabled\u003eCONFIRM READ \u0026 UNDERSTOOD ↗\u003c/button\u003e\u003cspan class=\"feedback\" id=\"feedback\" aria-live=\"polite\"\u003e\u003c/span\u003e\n\u003c/section\u003e\n\u003cfooter class=\"bottom\"\u003e\u003ca class=\"navbtn\" href=\"04_hierarchy.html\"\u003e← BACK TO HIERARCHY\u003c/a\u003e\u003cspan\u003eH. ANDLEBARS CREW © 2026\u003c/span\u003e\u003cspan\u003ePAGE 05 / 07\u003c/span\u003e\u003ca class=\"navbtn\" href=\"06_notice_board.html\"\u003eNEXT: NOTICES →\u003c/a\u003e\u003c/footer\u003e\n\u003c/div\u003e\n\u003cdiv class=\"toast\" id=\"toast\"\u003ePROTOCOL LOADED\u003c/div\u003e\n\u003cscript\u003e\nconst tabs=[...document.querySelectorAll('.tab')],cats=[...document.querySelectorAll('.category')],toast=document.getElementById('toast');let timer;\nfunction notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=\u003etoast.classList.remove('show'),1450)}\ntabs.forEach(tab=\u003etab.addEventListener('click',()=\u003e{tabs.forEach(t=\u003et.classList.remove('active'));tab.classList.add('active');cats.forEach(c=\u003ec.classList.remove('active'));const panel=document.getElementById(tab.dataset.tab);panel.classList.add('active');panel.querySelectorAll('.rule').forEach(r=\u003e{r.classList.remove('open');r.querySelector('.plus').textContent='+'});notify('PROTOCOL / '+tab.textContent.trim())}));\ndocument.querySelectorAll('.rule').forEach(rule=\u003erule.addEventListener('click',()=\u003e{const open=rule.classList.contains('open');rule.classList.toggle('open');rule.querySelector('.plus').textContent=open?'+':'−'}));\nconst agree=document.getElementById('agree'),ack=document.getElementById('ack'),feedback=document.getElementById('feedback');\nagree.addEventListener('change',()=\u003e{ack.disabled=!agree.checked;feedback.textContent=''});\nack.addEventListener('click',()=\u003e{if(!agree.checked)return;feedback.textContent='READ CONFIRMED — THANK YOU';notify('ACKNOWLEDGEMENT COMPLETE')});\n\u003c/script\u003e\n\u003cdiv class=\"crew-transition\" id=\"crewTransition\" aria-hidden=\"true\"\u003e\u003cdiv class=\"crew-transition-inner\"\u003e\u003cdiv class=\"crew-transition-mark\"\u003eH.\u003c/div\u003e\u003cdiv id=\"crewTransitionText\"\u003eOPENING NEXT SECTION\u003c/div\u003e\u003cdiv class=\"crew-transition-line\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cscript id=\"crew-navigation-script\"\u003e\n(()=\u003e{const layer=document.getElementById('crewTransition'),label=document.getElementById('crewTransitionText');if(!layer)return;document.querySelectorAll('a[href]').forEach(a=\u003e{const href=a.getAttribute('href');if(!href||href.startsWith('#')||href.startsWith('mailto:')||href.startsWith('tel:')||a.target==='_blank')return;const url=new URL(href,location.href);if opy\"\u003eUn punto central para mantenerse al día. Aquí se reúnen los comunicados de la administración, novedades, eventos y convocatorias de H. Andlebars Crew.\u003c/p\u003e\n  \u003cdiv class=\"hero-meta\"\u003e\u003cspan\u003eCHANNEL: \u003cb\u003ePUBLIC TO MEMBERS\u003c/b\u003e\u003c/span\u003e\u003cspan\u003eACCESS: \u003cb\u003eCREW NETWORK\u003c/b\u003e\u003c/span\u003e\u003cspan\u003eSTATUS: \u003cb\u003eONLINE\u003c/b\u003e\u003c/span\u003e\u003c/div\u003e\n \u003c/section\u003e\n \u003csection class=\"grid-top\"\u003e\n  \u003cdiv class=\"panel\"\u003e\n   \u003cdiv class=\"panel-head\"\u003e\u003ch2\u003e\u003cspan style=\"color:var(--red)\"\u003e●\u003c/span\u003e LATEST TRANSMISSION\u003c/h2\u003e\u003cspan class=\"tiny\"\u003ePINNED / 001\u003c/span\u003e\u003c/div\u003e\n   \u003cdiv class=\"latest\"\u003e\n    \u003cspan class=\"tag\"\u003eIMPORTANT · ADMINISTRATION\u003c/span\u003e\n    \u003ch3\u003eBienvenidos al centro de comunicados.\u003c/h3\u003e\n    \u003cp\u003eEste espacio concentra la información que el team necesita tener presente. Revisa las publicaciones, consulta sus detalles y mantente atento a las próximas actualizaciones oficiales.\u003c/p\u003e\n    \u003cdiv class=\"latest-foot\"\u003e\u003cspan\u003eFROM: SHUUDEO × JENNIE\u003c/span\u003e\u003cspan\u003eOPEN TRANSMISSION ↗\u003c/span\u003e\u003c/div\u003e\n   \u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"panel\"\u003e\n   \u003cdiv class=\"panel-head\"\u003e\u003ch2\u003eADMINISTRATION DESK\u003c/h2\u003e\u003cspan class=\"tiny\"\u003eAUTHORIZED\u003c/span\u003e\u003c/div\u003e\n   \u003cdiv class=\"owner-panel\"\u003e\n    \u003cdiv class=\"eyebrow\"\u003eOwner communication\u003c/div\u003e\u003ch3\u003eDirectiva del crew\u003c/h3\u003e\n    \u003cp\u003eLos comunicados oficiales de administración se publican bajo esta sección. Los nombres que aparecen aquí identifican a las personas encargadas de la dirección del team.\u003c/p\u003e\n    \u003cdiv class=\"owner-row\"\u003e\n     \u003cdiv class=\"owner\"\u003e\u003cdiv class=\"owner-icon\"\u003eS\u003c/div\u003e\u003cb\u003eSHUUDEO\u003c/b\u003e\u003cspan\u003eCO-OWNER\u003c/span\u003e\u003c/div\u003e\n     \u003cdiv class=\"owner\"\u003e\u003cdiv class=\"owner-icon\"\u003eJ\u003c/div\u003e\u003cb\u003eJENNIE\u003c/b\u003e\u003cspan\u003eCO-OWNER\u003c/span\u003e\u003c/div\u003e\n    \u003c/div\u003e\n   \u003c/div\u003e\n  \u003c/div\u003e\n \u003c/section\u003e\n \u003cdiv class=\"controls\"\u003e\n  \u003cdiv class=\"filters\" role=\"group\" aria-label=\"Filtrar comunicados\"\u003e\n   \u003cbutton class=\"filter active\" data-filter=\"all\"\u003eALL FEEDS\u003c/button\u003e\n   \u003cbutton class=\"filter\" data-filter=\"announcements\"\u003eANNOUNCEMENTS\u003c/button\u003e\n   \u003cbutton class=\"filter\" data-filter=\"updates\"\u003eUPDATES\u003c/button\u003e\n   \u003cbutton class=\"filter\" data-filter=\"events\"\u003eEVENTS\u003c/button\u003e\n   \u003cbutton class=\"filter\" data-filter=\"recruitment\"\u003eRECRUITMENT\u003c/button\u003e\n   \u003cbutton class=\"filter\" data-filter=\"important\"\u003eIMPORTANT\u003c/button\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"search-wrap\"\u003e\u003cinput id=\"search\" type=\"search\" placeholder=\"SEARCH TRANSMISSIONS...\" aria-label=\"Buscar comunicados\"\u003e\u003c/div\u003e\n \u003c/div\u003e\n \u003cdiv class=\"section-label\"\u003e\u003cspan\u003eAVAILABLE TRANSMISSIONS\u003c/span\u003e\u003cb id=\"count\"\u003e05 FILES FOUND\u003c/b\u003e\u003c/div\u003e\n \u003csection class=\"cards\" id=\"cards\"\u003e\n  \u003carticle class=\"notice\" data-category=\"announcements\" data-status=\"important\" data-title=\"Comunicado general de administración\" data-date=\"07 NOV 2026\" data-full=\"Este tablón será el canal central para los avisos de H. Andlebars Crew. La administración utilizará este espacio para publicar información general, aclaraciones y comunicados que deban conocer los integrantes. Revisa las novedades cada vez que ingreses y consulta directamente con la directiva si algún punto no está claro.\"\u003e\n   \u003cdiv class=\"notice-top\"\u003e\u003cspan class=\"category\"\u003e01 / ANNOUNCEMENTS\u003c/span\u003e\u003cspan class=\"status important\"\u003eIMPORTANT\u003c/span\u003e\u003c/div\u003e\u003ch3\u003eComunicado general de administración\u003c/h3\u003e\u003cp\u003eEl canal oficial para novedades, información relevante y mensajes de la directiva.\u003c/p\u003e\u003cdiv class=\"notice-bottom\"\u003e\u003cspan\u003e07 NOV 2026 · ADMIN\u003c/span\u003e\u003cspan class=\"arrow\"\u003e↗\u003c/span\u003e\u003c/div\u003e\n  \u003c/article\u003e\n  \u003carticle class=\"notice\" data-category=\"updates\" data-status=\"new\" data-title=\"Nueva estructura de páginas\" data-date=\"07 NOV 2026\" data-full=\"La página web se está organizando por secciones para que cada integrante encuentre fácilmente la información del team. Ya se encuentran desarrolladas las áreas de presentación, organizaciones, jerarquías y reglas. Esta sección reúne las novedades y cambios que se vayan incorporando.\"\u003e\n   \u003cdiv class=\"notice-top\"\u003e\u003cspan class=\"category\"\u003e02 / UPDATES\u003c/span\u003e\u003cspan class=\"status new\"\u003eNEW\u003c/span\u003e\u003c/div\u003e\u003ch3\u003eNueva estructura de páginas\u003c/h3\u003e\u003cp\u003eLa información del crew se está organizando en secciones para facilitar la navegación.\u003c/p\u003e\u003cdiv class=\"notice-bottom\"\u003e\u003cspan\u003e07 NOV 2026 · WEB TEAM\u003c/span\u003e\u003cspan class=\"arrow\"\u003e↗\u003c/span\u003e\u003c/div\u003e\n  \u003c/article\u003e\n  \u003carticle class=\"notice\" data-category=\"events\" data-status=\"new\" data-title=\"Próximas actividades\" data-date=\"COMING SOON\" data-full=\"En este espacio se anunciarán actividades, dinámicas y encuentros organizados para los integrantes. Los detalles —fecha, horario, modalidad y requisitos— se agregarán en una publicación cuando estén confirmados por la administración.\"\u003e\n   \u003cdiv class=\"notice-top\"\u003e\u003cspan class=\"category\"\u003e03 / EVENTS\u003c/span\u003e\u003cspan class=\"status new\"\u003eNEW\u003c/span\u003e\u003c/div\u003e\u003ch3\u003ePróximas actividades\u003c/h3\u003e\u003cp\u003eLas actividades del crew se anunciarán aquí con sus fechas y detalles confirmados.\u003c/p\u003e\u003cdiv class=\"notice-bottom\"\u003e\u003cspan\u003eCOMING SOON · EVENTS\u003c/span\u003e\u003cspan class=\"arrow\"\u003e↗\u003c/span\u003e\u003c/div\u003e\n  \u003c/article\u003e\n  \u003carticle class=\"notice\" data-category=\"recruitment\" data-status=\"important\" data-title=\"Convocatorias y nuevos ingresos\" data-date=\"OPEN CHANNEL\" data-full=\"Cuando existan vacantes o se abra una convocatoria, aquí se indicará qué organización busca integrantes, qué función está disponible y cómo presentar una ficha. No envíes datos personales sensibles: la ficha debe limitarse a la información de personaje que solicite el team.\"\u003e\n   \u003cdiv class=\"notice-top\"\u003e\u003cspan class=\"category\"\u003e04 / RECRUITMENT\u003c/span\u003e\u003cspan class=\"status important\"\u003eIMPORTANT\u003c/span\u003e\u003c/div\u003e\u003ch3\u003eConvocatorias y nuevos ingresos\u003c/h3\u003e\u003cp\u003eConsulta aquí los avisos de ingreso, vacantes y requisitos para crear tu ficha.\u003c/p\u003e\u003cdiv class=\"notice-bottom\"\u003e\u003cspan\u003eOPEN CHANNEL · RECRUITMENT\u003c/span\u003e\u003cspan class=\"arrow\"\u003e↗\u003c/span\u003e\u003c/div\u003e\n  \u003c/article\u003e\n  \u003carticle class=\"notice\" data-category=\"announcements\" data-status=\"archived\" data-title=\"Cómo utilizar este tablón\" data-date=\"GUIDE / 006\" data-full=\"Usa los filtros para separar los comunicados por categoría. Escribe una palabra en el buscador para localizar un aviso y selecciona cualquier tarjeta para abrir su contenido completo. Las etiquetas NEW e IMPORTANT ayudan a reconocer publicaciones recientes o prioritarias.\"\u003e\n   \u003cdiv class=\"notice-top\"\u003e\u003cspan class=\"category\"\u003e05 / IMPORTANT NOTICES\u003c/span\u003e\u003cspan class=\"status archived\"\u003eGUIDE\u003c/span\u003e\u003c/div\u003e\u003ch3\u003eCómo utilizar este tablón\u003c/h3\u003e\u003cp\u003eFiltra por categoría, busca palabras clave y abre una tarjeta para leer el comunicado completo.\u003c/p\u003e\u003cdiv class=\"notice-bottom\"\u003e\u003cspan\u003eGUIDE · SYSTEM\u003c/span\u003e\u003cspan class=\"arrow\"\u003e↗\u003c/span\u003e\u003c/div\u003e\n  \u003c/article\u003e\n \u003c/section\u003e\n \u003cdiv class=\"empty\" id=\"empty\"\u003eNO TRANSMISSIONS MATCH YOUR SEARCH.\u003c/div\u003e\n \u003csection class=\"recruit\"\u003e\n  \u003cdiv\u003e\u003cdiv class=\"eyebrow\"\u003eRecruitment / Open channel\u003c/div\u003e\u003ch3\u003e¿Quieres formar parte del crew?\u003c/h3\u003e\u003cp\u003eAntes de enviar tu ficha, revisa las reglas y la información sobre las organizaciones. Las convocatorias oficiales aparecerán en este tablón.\u003c/p\u003e\u003c/div\u003e\n  \u003cbutton class=\"btn\" id=\"rulesBtn\"\u003eREVISAR REGLAS ↗\u003c/button\u003e\n \u003c/section\u003e\n\u003c/main\u003e\n\u003cfooter\u003e\u003cspan\u003eH. ANDLEBARS CREW © 2026 — INTERNAL NETWORK\u003c/span\u003e\u003cspan\u003e\u003ca href=\"05_rules.html\"\u003e05 / RULES\u003c/a\u003e　·　\u003ca href=\"04_hierarchy.html\"\u003e04 / HIERARCHY\u003c/a\u003e　·　\u003ca href=\"01_portada.html\"\u003eHOME\u003c/a\u003e\u003c/span\u003e\u003ca class=\"navbtn\" href=\"07_member_directory.html\"\u003eNEXT: DIRECTORY →\u003c/a\u003e\u003c/footer\u003e\n\u003cdiv class=\"modal-backdrop\" id=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modalTitle\"\u003e\n \u003cdiv class=\"modal\"\u003e\u003cdiv class=\"modal-head\"\u003e\u003cspan id=\"modalType\"\u003eTRANSMISSION DETAILS / 006\u003c/span\u003e\u003cbutton class=\"close\" id=\"closeModal\" aria-label=\"Cerrar\"\u003e✕\u003c/button\u003e\u003c/div\u003e\u003cdiv l');\nfunction openCard(card){\n document.getElementById('modalCategory').textContent=card.querySelector('.category').textContent;\n document.getElementById('modalTitle').textContent=card.dataset.title;\n document.getElementById('modalText').textContent=card.dataset.full;\n document.getElementById('modalDate').textContent=card.dataset.date;\n document.getElementById('modalType').textContent='TRANSMISSION DETAILS / '+card.dataset.category.toUpperCase();\n modal.classList.add('show');document.body.style.overflow='hidden';toast('FILE OPENED');\n}\ncards.forEach(card=\u003ecard.addEventListener('click',()=\u003eopenCard(card)));\nfunction closeModal(){modal.classList.remove('show');document.body.style.overflow=''}\ndocument.getElementById('closeModal').addEventListener('click',closeModal);\ndocument.getElementById('modalClose2').addEventListener('click',closeModal);\nmodal.addEventListener('click',e=\u003e{if(e.target===modal)closeModal()});\ndocument.addEventListener('keydown',e=\u003e{if(e.key==='Escape')closeModal()});\ndocument.getElementById('copyBtn').addEventListener('click',async()=\u003e{\n const title=document.getElementById('modalTitle').textContent;\n try{await navigator.clipboard.writeText(title);toast('TITLE COPIED TO CLIPBOARD')}catch(e){toast('SELECT AND COPY THE TITLE MANUALLY')}\n});\nfunction toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=\u003eel.classList.remove('show'),2200)}\ndocument.getElementById('rulesBtn').addEventListener('click',()=\u003e{window.location.href='05_rules.html'});\nfunction tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('es-CL',{hour12:false})}\ntick();setInterval(tick,1000);\nwindow.addEventListener('scroll',()=\u003e{const max=document.documentElement.scrollHeight-innerHeight;document.getElementById('progress').style.width=(max\u003e0?scrollY/max*100:0)+'%'});\ 003cmain class=\"directory\" id=\"directory\"\u003e\n\u003carticle class=\"member\" data-name=\"shuudeo\" data-role=\"owner founder\" data-org=\"owners\"\u003e\n\u003cdiv class=\"avatar owner\"\u003eS\u003c/div\u003e\u003cdiv class=\"memberdata\"\u003e\u003csmall\u003eFILE / HAC-001 · OWNER\u003c/small\u003e\u003ch2\u003eSHUUDEO\u003c/h2\u003e\u003cp\u003eFundador y owner de H. ANDLEBARS CREW. Forma parte de la dirección general del proyecto.\u003c/p\u003e\u003cdiv class=\"chips\"\u003e\u003cspan\u003eOWNER\u003c/span\u003e\u003cspan\u003eFOUNDERS\u003c/span\u003e\u003c/div\u003e\u003cbutton class=\"details\" data-profile=\"shuudeo\"\u003eOPEN PERSONNEL FILE ↗\u003c/button\u003e\u003c/div\u003e\n\u003c/article\u003e\n\u003carticle class=\"member\" data-name=\"jennie\" data-role=\"co-owner founder\" data-org=\"owners\"\u003e\n\u003cdiv class=\"avatar owner\"\u003eJ\u003c/div\u003e\u003cdiv class=\"memberdata\"\u003e\u003csmall\u003eFILE / HAC-002 · CO-OWNER\u003c/small\u003e\u003ch2\u003eJENNIE\u003c/h2\u003e\u003cp\u003eCo-owner de H. ANDLEBARS CREW. Comparte la coordinación y el desarrollo del proyecto.\u003c/p\u003e\u003cdiv class=\"chips\"\u003e\u003cspan\u003eCO-OWNER\u003c/span\u003e\u003cspan\u003eFOUNDERS\u003c/span\u003e\u003c/div\u003e\u003cbutton class=\"details\" data-profile=\"jennie\"\u003eOPEN PERSONNEL FILE ↗\u003c/button\u003e\u003c/div\u003e\n\u003c/article\u003e\n\u003cdiv class=\"empty\" id=\"empty\" hidden\u003e\u003cb\u003eNO FILES FOUND\u003c/b\u003eNo hay perfiles que coincidan con tu búsqueda. Prueba con otro nombre o filtro.\u003c/div\u003e\n\u003c/main\u003e\n\u003cdiv class=\"note\"\u003e\u003cb\u003eDATABASE NOTE //\u003c/b\u003e Por ahora se muestran los dos perfiles de dirección confirmados. Los demás integrantes se pueden incorporar cuando tengas sus nombres, organización, rango y descripción.\u003c/div\u003e\n\u003cfooter class=\"bottom\"\u003e\u003ca class=\"navbtn\" href=\"04_hierarchy.html\"\u003e← BACK TO NOTICE BOARD\u003c/a\u003e\u003cspan\u003eH. ANDLEBARS CREW © 2026\u003c/span\u003e\u003cspan\u003ePAGE 07 / 07\u003c/span\u003e\u003c/footer\u003e\n\u003c/div\u003e\n\u003cdiv class=\"overlay\" id=\"profileModal\"\u003e\u003csection class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modalName\"\u003e\u003cheader class=\"modalhead\"\u003e\u003cdiv\u003e\u003csmall\u003ePERSONNEL RECORD / VERIFIED ENTRY\u003c/small\u003e\u003ch3 id=\"modalName\"\u003ePROFILE\u003c/h3\u003e\u003c/div\u003e\u003cbutton class=\"close\" aria-label=\"Cerrar\"\u003e×\u003c/button\u003e\u003c/header\u003e\u003cdiv class=\"modalbody\"\u003e\u003cdiv class=\"role\" id=\"modalRole\"\u003e\u003c/div\u003e\u003cp id=\"modalDesc\"\u003e\u003c/p\u003e\u003cp id=\"modalExtra\"\u003e\u003c/p\u003e\u003c/div\u003e\u003cfooter class=\"modalfoot\"\u003e\u003cspan\u003eHAC / PRIVATE DIRECTORY\u003c/span\u003e\u003cspan id=\"modalId\"\u003e\u003c/span\u003e\u003c/footer\u003e\u003c/section\u003e\u003c/div\u003e\n\u003cscript\u003e\nconst search=document.getElementById('search'),cards=[...document.querySelectorAll('.member')],filters=[...document.querySelectorAll('.filter')],empty=document.getElementById('empty'),resultLabel=document.getElementById('resultLabel'),count=document.getElementById('count');\nlet currentFilter='all';\nfunction applyFilters(){const q=search.value.trim().toLowerCase();let shown=0;cards.forEach(card=\u003e{const text=(card.dataset.name+' '+card.dataset.role+' '+card.textContent).toLowerCase();const matchText=text.includes(q);const matchFilter=currentFilter==='all'||(currentFilter==='owners'\u0026\u0026card.dataset.org==='owners')||card.dataset.org===currentFilter;const visible=matchText\u0026\u0026matchFilter;card.hidden=!visible;if(visible)shown++});empty.hidden=shown!==0;resultLabel.textContent='SHOWING '+String(shown).padStart(2,'0')+' FILE'+(shown===1?'':'S')}\nsearch.addEventListener('input',applyFilters);\nfilters.forEach(btn=\u003ebtn.addEventListener('click',()=\u003e{filters.forEach(x=\u003ex.classList.remove('active'));btn.classList.add('active');currentFilter=btn.dataset.filter;applyFilters()}));\nconst profiles={shuudeo:{name:'SHUUDEO',role:'OWNER / FOUNDER · FILE HAC-001',desc:'Fundador y owner de H. ANDLEBARS CREW. Está a cargo de la dirección general del team y de impulsar su identidad, organización y desarrollo.',extra:'Este expediente contiene únicamente la información de rol confirmada para el proyecto. Se podrán añadir más datos cuando se definan.',id:'HAC-001'},jennie:{name:'JENNIE',role:'CO-OWNER · FILE HAC-002',desc:'Co-owner de H. ANDLEBARS CREW. Comparte la coordinación del proyecto y participa en el desarrollo y funcionamiento de la crew.',extra:'Este expediente contiene únicamente la información de rol confirmada para el proyecto. Se podrán añadir más datos cuando se definan.',id:'HAC-002'}};\nconst overlay=document.getElementById('profileModal');\ndocument.querySelectorAll('[data-profile]').forEach(btn=\u003ebtn.addEventListener('click',()=\u003e{const p=profiles[btn.dataset.profile];document.getElementById('modalName').textContent=p.name;document.getElementById('modalRole').textContent=p.role;document.getElementById('modalDesc').textContent=p.desc;document.getElementById('modalExtra').textContent=p.extra;document.getElementById('modalId').textContent=p.id;overlay.classList.add('open');document.body.style.overflow='hidden'}));\nfunction closeModal(){overlay.classList.remove('open');document.body.style.overflow=''}\ndocument.querySelector('.close').addEventListener('click',closeModal);overlay.addEventListener('click',e=\u003e{if(e.target===overlay)closeModal()});document.addEventListener('keydown',e=\u003e{if(e.key==='Escape')closeModal()});\napplyFilters();\n\u003c/script\u003e\n\u003cdiv class=\"crew-transition\" id=\"crewTransition\" aria-hidden=\"true\"\u003e\u003cdiv class=\"crew-transition-inner\"\u003e\u003cdiv class=\"crew-transition-mark\"\u003eH.\u003c/div\u003e\u003cdiv id=\"crewTransitionText\"\u003eOPENING NEXT SECTION\u003c/div\u003e\u003cdiv class=\"crew-transition-line\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cscript id=\"crew-navigation-script\"\u003e\n(()=\u003e{const layer=document.getElementById('crewTransition'),label=document.getElementById('crewTransitionText');if(!layer)return;document.querySelectorAll('a[href]').forEach(a=\u003e{const href=a.getAttribute('href');if(!href||href.startsWith('#')||href.startsWith('mailto:')||href.startsWith('tel:')||a.target==='_blank')return;const url=new URL(href,location.href);if(url.origin!==location.origin||!url.pathname.endsWith('.html'))return;a.addEventListener('click',e=\u003e{if(e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;e.preventDefault();label.textContent='LOADING / '+(a.textContent.trim().replace(/\\s+/g,' ').slice(0,28)||'NEXT SECTION');layer.classList.add('active');setTimeout(()=\u003elocation.href=url.href,430)});});})();\n\u003c/script\u003e\n\n\u003cscript\u003e\n(function(){\n document.addEventListener('click',function(ev){\n  const a=ev.target.closest('a[href]'); if(!a)return;\n  const raw=a.getAttribute('href')||'';\n  const file=raw.split(/[?#]/)[0].split('/').pop();\n  const map={\"index.html\": 0, \"h_andlebars_crew_portada.html\": 0, \"h_andlebars_crew_pagina_02_founders.html\": 1, \"h_andlebars_crew_pagina_03_organizations.html\": 2, \"h_andlebars_crew_pagina_04_hierarchy.html\": 3, \"h_andlebars_crew_pagina_05_rules.html\": 4, \"h_andlebars_crew_pagina_06_notice_board.html\": 5, \"h_andlebars_crew_pagina_07_member_directory.html\": 6, \"01_portada.html\": 0, \"02_founders.html\": 1, \"03_organizations.html\": 2, \"04_hierarchy.html\": 3, \"05_rules.html\": 4, \"06_notice_board.html\": 5, \"07_member_directory.html\": 6};\n  if(Object.prototype.hasOwnProperty.call(map,file)){\n   ev.preventDefault(); parent.postMessage({crewPage:map[file]},'*');\n  }\n },true);\n})();\n\u003c/script\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e"];
let current=0;
const frame=document.getElementById('pageFrame'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next'),dots=document.getElementById('dots');
pageTitles.forEach((t,i)=>{const b=document.createElement('button');b.className='dot';b.type='button';b.title=(i+1)+' · '+t;b.setAttribute('aria-label','Go to '+t);b.addEventListener('click',()=>showPage(i));dots.appendChild(b)});
function showPage(i){if(i<0||i>=pageDocs.length)return;current=i;frame.classList.add('leaving');window.setTimeout(()=>{frame.srcdoc=pageDocs[current];counter.textContent=String(i+1).padStart(2,'0')+' / 07 · '+pageTitles[i];prev.disabled=i===0;next.disabled=i===6;[...dots.children].forEach((d,j)=>d.classList.toggle('active',j===i));frame.classList.remove('leaving')},120)}
prev.addEventListener('click',()=>showPage(current-1));next.addEventListener('click',()=>showPage(current+1));
window.addEventListener('message',e=>{if(e.data&&Number.isInteger(e.data.crewPage))showPage(e.data.crewPage)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')showPage(current+1);if(e.key==='ArrowLeft')showPage(current-1)});
let sx=0;document.getElementById('stage').addEventListener('touchstart',e=>{sx=e.changedTouches[0].screenX},{passive:true});document.getElementById('stage').addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>85)showPage(current+(dx<0?1:-1))},{passive:true});
showPage(0);
